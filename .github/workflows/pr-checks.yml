name: PR Quality Checks

on:
  pull_request:
    branches:
      - production
      - dev
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel previous runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    # Skip draft PRs
    if: github.event.pull_request.draft == false
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better git operations
      
      - name: 🔧 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🔍 TypeScript type checks
        run: npm run typecheck
      
      - name: 📝 Linting checks
        run: npm run check
      
      - name: 🧪 Run test suite
        run: npm test
        env:
          CI: true
      
      - name: 📊 Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: |
            packages/*/test-results/
            coverage/
          retention-days: 7
      
      - name: 💬 Comment PR with results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const emoji = status === 'success' ? '✅' : '❌';
            
            const body = `### ${emoji} Quality Checks ${status === 'success' ? 'Passed' : 'Failed'}
            
            | Check | Status |
            |-------|--------|
            | TypeScript | ${emoji} |
            | Linting | ${emoji} |
            | Tests | ${emoji} |
            
            ${status === 'failure' ? '⚠️ Please fix the issues above before merging.' : '🚀 All checks passed! Ready for review.'}
            `;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Quality Checks')
            );
            
            // Update or create comment
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: 🔒 Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true  # Don't block PRs, just warn
      
      - name: 📝 Report audit results
        if: failure()
        run: echo "⚠️ Security vulnerabilities found. Please review."
