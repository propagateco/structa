name: Test OIDC Authentication

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to test (dev, production, or personal stage name)'
        required: true
        default: 'dev'
        type: string

permissions:
  id-token: write  # Required for OIDC token
  contents: read

env:
  AWS_REGION: eu-west-2

jobs:
  verify-oidc:
    name: Verify OIDC (${{ inputs.stage }})
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::571512465874:role/structa-${{ inputs.stage }}-GitHubActionsDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: ✅ Verify authentication
        run: |
          echo "🔐 Testing AWS authentication for stage: ${{ inputs.stage }}"
          aws sts get-caller-identity
          echo ""
          echo "✅ OIDC authentication successful!"
          echo "Account: $(aws sts get-caller-identity --query Account --output text)"
          echo "Role: $(aws sts get-caller-identity --query Arn --output text | cut -d'/' -f2)"
