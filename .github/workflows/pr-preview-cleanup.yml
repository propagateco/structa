name: PR Cleanup

on:
    pull_request:
        types: [closed]
    workflow_dispatch:
        inputs:
            pr_number:
                description: 'PR number to cleanup (for manual cleanup)'
                required: true
                type: number

permissions:
    id-token: write
    contents: read

env:
    AWS_REGION: eu-west-2
    STAGE_NAME: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('pr-{0}', github.event.inputs.pr_number) }}

jobs:
    # ===========================================
    # Destroy Preview Environment
    # ===========================================
    destroy-preview:
        name: Destroy Preview Environment
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: dev

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Configure AWS credentials (Dev)
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_DEV }}:role/structa-dev-GitHubActionsDeploy
                  aws-region: ${{ env.AWS_REGION }}

            - name: Clear any stale SST lock
              run: npx sst unlock --stage ${{ env.STAGE_NAME }} --print-logs
              continue-on-error: true
              env:
                  AWS_PROFILE: ''
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}

            - name: Destroy SST environment
              run: npx sst remove --stage ${{ env.STAGE_NAME }} --print-logs
              continue-on-error: true
              env:
                  AWS_PROFILE: ''
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}

            - name: Unlock SST on cancellation/failure
              if: always()
              run: npx sst unlock --stage ${{ env.STAGE_NAME }} --print-logs
              env:
                  AWS_PROFILE: ''
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}

            - name: Retry cleanup after unlock (if previous step failed)
              if: failure()
              run: npx sst remove --stage ${{ env.STAGE_NAME }} --print-logs
              env:
                  AWS_PROFILE: ''
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
