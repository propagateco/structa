name: PR Cleanup

on:
    # Run from the base branch so closing a PR targeting dev is cleaned up too.
    # This workflow only destroys an explicitly derived pr-N stage and does not
    # execute code from the closed PR.
    pull_request_target:
        types: [closed]
    workflow_dispatch:
        inputs:
            pr_number:
                description: 'PR number to clean up'
                required: false
                type: number
            stage_name:
                description: 'Allowlisted personal SST stage to clean up (harrisonking only)'
                required: false
                type: string

permissions:
    id-token: write
    contents: read

env:
    AWS_REGION: eu-west-2

jobs:
    # ===========================================
    # Destroy Preview Environment
    # ===========================================
    destroy-preview:
        name: Destroy Preview Environment
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: dev
        env:
            AWS_PROFILE: ''
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}

        steps:
            - name: Resolve and validate cleanup target
              id: target
              shell: bash
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
                  MANUAL_STAGE: ${{ github.event.inputs.stage_name }}
              run: |
                  set -euo pipefail

                  if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
                      STAGE_NAME="pr-${PR_NUMBER}"
                  elif [[ -n "$MANUAL_STAGE" && -n "$PR_NUMBER" ]]; then
                      echo "Provide either pr_number or stage_name, not both." >&2
                      exit 1
                  elif [[ "$MANUAL_STAGE" == "harrisonking" ]]; then
                      STAGE_NAME="$MANUAL_STAGE"
                  elif [[ "$MANUAL_STAGE" == "" && "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
                      STAGE_NAME="pr-${PR_NUMBER}"
                  else
                      echo "Target must be a PR number or the allowlisted stage harrisonking." >&2
                      exit 1
                  fi

                  if [[ ! "$STAGE_NAME" =~ ^pr-[0-9]+$ && "$STAGE_NAME" != "harrisonking" ]]; then
                      echo "Refusing to clean non-preview stage '$STAGE_NAME'." >&2
                      exit 1
                  fi

                  echo "stage_name=$STAGE_NAME" >> "$GITHUB_OUTPUT"

            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Configure AWS credentials (Dev)
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_DEV }}:role/structa-dev-GitHubActionsDeploy
                  aws-region: ${{ env.AWS_REGION }}

            - name: Destroy SST environment
              id: destroy
              shell: bash
              env:
                  STAGE_NAME: ${{ steps.target.outputs.stage_name }}
              # Only recover from an SST state-lock failure. Configuration,
              # credentials, and provider errors should fail the job directly.
              run: |
                  set +e
                  MAX_ATTEMPTS=3
                  for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
                      LOG_FILE="$RUNNER_TEMP/sst-remove-${attempt}.log"
                      npx sst remove --stage "$STAGE_NAME" --print-logs 2>&1 | tee "$LOG_FILE"
                      EXIT_CODE=${PIPESTATUS[0]}

                      if [ "$EXIT_CODE" -eq 0 ]; then
                          exit 0
                      fi

                      if grep -Eiq 'lock|already[[:space:]]+running|another[[:space:]].*process|acquir(e|ing).*state' "$LOG_FILE"; then
                          echo "lock_failure=true" >> "$GITHUB_OUTPUT"
                          echo "SST removal failed because the stage appears to be locked; retrying after unlock."
                          exit 0
                      fi

                      if grep -Eiq 'bad status: 5[0-9]{2}|gateway timeout|could not install bun|timed out|econnreset' "$LOG_FILE" && [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
                          echo "Transient SST bootstrap/network failure; retrying in 10 seconds (attempt $((attempt + 1))/$MAX_ATTEMPTS)."
                          sleep 10
                          continue
                      fi

                      echo "SST removal failed for a non-retryable error."
                      exit "$EXIT_CODE"
                  done

            - name: Clear stale SST lock
              if: steps.destroy.outputs.lock_failure == 'true'
              env:
                  STAGE_NAME: ${{ steps.target.outputs.stage_name }}
              run: npx sst unlock --stage "$STAGE_NAME" --print-logs

            - name: Retry cleanup after clearing lock
              if: steps.destroy.outputs.lock_failure == 'true'
              env:
                  STAGE_NAME: ${{ steps.target.outputs.stage_name }}
              run: npx sst remove --stage "$STAGE_NAME" --print-logs
