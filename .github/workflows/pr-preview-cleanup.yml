name: PR Cleanup

on:
    pull_request:
        types: [closed]
    workflow_dispatch:
        inputs:
            pr_number:
                description: 'PR number to cleanup (for manual cleanup)'
                required: true
                type: number

permissions:
    id-token: write
    contents: read

env:
    AWS_REGION: eu-west-2
    STAGE_NAME: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('pr-{0}', github.event.inputs.pr_number) }}

jobs:
    # ===========================================
    # Destroy Preview Environment
    # ===========================================
    destroy-preview:
        name: Destroy Preview Environment
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: dev
        env:
            AWS_PROFILE: ''
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Configure AWS credentials (Dev)
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_DEV }}:role/structa-dev-GitHubActionsDeploy
                  aws-region: ${{ env.AWS_REGION }}

            - name: Destroy SST environment
              id: destroy
              shell: bash
              # Only recover from an SST state-lock failure. Configuration,
              # credentials, and provider errors should fail the job directly.
              run: |
                  set +e
                  LOG_FILE="$RUNNER_TEMP/sst-remove.log"
                  npx sst remove --stage "${{ env.STAGE_NAME }}" --print-logs 2>&1 | tee "$LOG_FILE"
                  EXIT_CODE=${PIPESTATUS[0]}

                  if [ "$EXIT_CODE" -eq 0 ]; then
                      exit 0
                  fi

                  if grep -Eiq 'lock|already[[:space:]]+running|another[[:space:]].*process|acquir(e|ing).*state' "$LOG_FILE"; then
                      echo "lock_failure=true" >> "$GITHUB_OUTPUT"
                      echo "SST removal failed because the stage appears to be locked; retrying after unlock."
                      exit 0
                  fi

                  echo "SST removal failed for a non-lock error; not retrying."
                  exit "$EXIT_CODE"

            - name: Clear stale SST lock
              if: steps.destroy.outputs.lock_failure == 'true'
              run: npx sst unlock --stage ${{ env.STAGE_NAME }} --print-logs

            - name: Retry cleanup after clearing lock
              if: steps.destroy.outputs.lock_failure == 'true'
              run: npx sst remove --stage ${{ env.STAGE_NAME }} --print-logs
